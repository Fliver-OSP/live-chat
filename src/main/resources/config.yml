# Fliver Live Chat configuration.
#
# There are NO Discord credentials in this file, on purpose - the bot token
# and webhooks live on the backend (see PROTOCOL.md). The only secret this
# plugin ever holds is its own pairing token from /live-chat auth, and that
# is stored encrypted in pairing.key/pairing.dat next to this file, not here.

# Which lang/<code>.yml to load. Ships with en_US - copy it, translate it,
# and point this at your new file's name to add a language (no rebuild
# needed).
language: en_US

# How often (seconds) /live-chat auth checks whether the pairing link has
# been completed in the browser yet.
poll-interval-seconds: 3

# How Discord messages look in-game. <player> and <message> are substituted
# as literal text (never re-parsed as tags), so a Discord user can't inject
# formatting/color codes through their name or message.
discord-message-format: "<gray>[Discord]</gray> <white><player></white><gray>: </gray><white><message></white>"

# Check GitHub Releases (Fliver-OSP/live-chat) for a newer plugin version and
# announce it in chat when one appears. Disable if you don't want update pings.
update-check:
  enabled: true
  # Hours between checks after the first check (~1 minute after enable).
  interval-hours: 6

# Minecraft -> Discord (chat relay is always on when linked; these are optional).
# Disabled by default — turn on with /live-chat events <kind> on.
# Placeholders: %player%; death also %death_message%; advancement %advancement%;
# gamemode %gamemode%; kick %reason%. Discord markdown allowed.
events:
  join:
    enabled: false
    discord-format: "**%player%** joined the game"
  leave:
    enabled: false
    discord-format: "**%player%** left the game"
  death:
    enabled: false
    discord-format: "%death_message%"
  advancement:
    enabled: false
    discord-format: "**%player%** made the advancement **%advancement%**"
  gamemode:
    enabled: false
    discord-format: "**%player%** changed gamemode to **%gamemode%**"
  kick:
    enabled: false
    discord-format: "**%player%** was kicked: %reason%"
