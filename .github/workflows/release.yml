name: Release

# Cut a GitHub Release only when <version> in pom.xml actually changes.
# Ordinary code/docs pushes do not run this workflow. Bump the version to
# publish; same version = no-op even if pom.xml was touched for other reasons.

on:
  push:
    branches: [main]
    paths:
      - "pom.xml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-chat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the previous commit to detect a real version bump.
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Read plugin version
        id: ver
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null object or invalid expression" ]; then
            echo "Could not read project.version from pom.xml" >&2
            exit 1
          fi
          SAFE="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          {
            echo "version=$VERSION"
            echo "tag=v${SAFE}"
            echo "jar=Fliver-LiveChat-${VERSION}.jar"
          } >> "$GITHUB_OUTPUT"

      - name: Detect pom version bump
        id: bump
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — treating as release candidate for $VERSION"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "First commit — treating $VERSION as a version bump"
            exit 0
          fi
          git show HEAD^:pom.xml > /tmp/prev-pom.xml
          PREV="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version -f /tmp/prev-pom.xml)"
          if [ -z "$PREV" ] || [ "$PREV" = "null object or invalid expression" ]; then
            echo "Could not read previous project.version" >&2
            exit 1
          fi
          echo "previous=$PREV current=$VERSION"
          if [ "$PREV" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pom.xml changed but <version> is still $VERSION — skipping release"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped: $PREV → $VERSION"
          fi

      - name: Check if release already exists
        id: check
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build jar
        if: steps.bump.outputs.changed == 'true' && steps.check.outputs.exists != 'true'
        run: mvn -B -DskipTests package

      - name: Upload build artifact
        if: steps.bump.outputs.changed == 'true' && steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.jar }}
          path: target/${{ steps.ver.outputs.jar }}
          if-no-files-found: error

      - name: Create Release
        if: steps.bump.outputs.changed == 'true' && steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR="target/${{ steps.ver.outputs.jar }}"
          test -f "$JAR"
          gh release create "${{ steps.ver.outputs.tag }}" "$JAR" \
            --repo "${{ github.repository }}" \
            --title "Fliver Live Chat ${{ steps.ver.outputs.version }}" \
            --notes "Fliver Live Chat \`${{ steps.ver.outputs.version }}\` (commit \`${{ github.sha }}\`). Download the .jar and put it in your server's plugins/ folder."
