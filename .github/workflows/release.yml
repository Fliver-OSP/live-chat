name: Release

# On push to main, build the jar and publish a GitHub Release if this pom
# version doesn't already have a tag. Bump <version> in pom.xml to cut a new
# release; unchanged version = no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-chat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Read plugin version
        id: ver
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null object or invalid expression" ]; then
            echo "Could not read project.version from pom.xml" >&2
            exit 1
          fi
          SAFE="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          {
            echo "version=$VERSION"
            echo "tag=v${SAFE}"
            echo "jar=Fliver-LiveChat-${VERSION}.jar"
          } >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build jar
        if: steps.check.outputs.exists != 'true'
        run: mvn -B -DskipTests package

      - name: Upload build artifact
        if: steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.jar }}
          path: target/${{ steps.ver.outputs.jar }}
          if-no-files-found: error

      - name: Create Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR="target/${{ steps.ver.outputs.jar }}"
          test -f "$JAR"
          gh release create "${{ steps.ver.outputs.tag }}" "$JAR" \
            --repo "${{ github.repository }}" \
            --title "Fliver Live Chat ${{ steps.ver.outputs.version }}" \
            --notes "Fliver Live Chat \`${{ steps.ver.outputs.version }}\` (commit \`${{ github.sha }}\`). Download the .jar and put it in your server's plugins/ folder."
